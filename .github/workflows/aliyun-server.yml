name: Aliyun server setup
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Server inspection, read-only live verification or one-time setup
        type: choice
        options: [inspect, verify, install-docker, configure-web, inspect-retired, retire-old, transport-test, migration-prepare, migration-fetch-plan, migration-apply, migration-verify, migration-cleanup]
        default: inspect
      expected_config_hash:
        description: Reviewed Nginx or retired-service plan SHA-256
        type: string
        required: false
      migration_request:
        description: RSA/AES sealed request; never provide a plaintext token or data
        type: string
        required: false
      expected_plan_hash:
        description: Reviewed owner migration plan SHA-256; required for apply
        type: string
        required: false
      expected_app_commit:
        description: Running application commit reviewed for this migration
        type: string
        default: 65285905bc2738f57576e97f76ce8f8ea240321a
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: aliyun-server-setup-${{ github.repository }}
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/codex/aliyun-data-migration' && startsWith(inputs.operation, 'migration-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare a small transport probe
        if: inputs.operation == 'transport-test'
        run: |
          mkdir -p "$RUNNER_TEMP/jiashu-network-probe"
          python3 -c 'import os,sys;open(sys.argv[1],"wb").write(os.urandom(1024*1024))' "$RUNNER_TEMP/jiashu-network-probe/image.tar.gz"
      - name: Store the small HTTPS probe
        id: probe
        if: inputs.operation == 'transport-test'
        uses: actions/upload-artifact@v4
        with:
          name: aliyun-network-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/jiashu-network-probe/image.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Verify application checks before changing the web entry
        if: inputs.operation == 'configure-web' || inputs.operation == 'retire-old'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_OPERATION: bootstrap
          BOOTSTRAP_CONFIRM: BOOTSTRAP-JIASHU-TEST
        run: |
          node deploy/aliyun/check-ci.mjs
          grep -qx 'ready=true' "$GITHUB_OUTPUT"
      - name: Run the selected setup step
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          ALIYUN_KNOWN_HOSTS: ${{ secrets.ALIYUN_KNOWN_HOSTS }}
          ALIYUN_SSH_PORT: ${{ vars.ALIYUN_SSH_PORT || '22' }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_CONFIG_HASH: ${{ inputs.expected_config_hash }}
          EXPECTED_COMMIT: ${{ github.sha }}
          ARTIFACT_ID: ${{ steps.probe.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.probe.outputs.artifact-digest }}
          GITHUB_TOKEN: ${{ github.token }}
          MIGRATION_REQUEST: ${{ inputs.migration_request }}
          EXPECTED_PLAN_HASH: ${{ inputs.expected_plan_hash }}
          EXPECTED_APP_COMMIT: ${{ inputs.expected_app_commit }}
        run: |
          set -euo pipefail
          config=$(bash deploy/aliyun/ssh-config.sh)
          case "$OPERATION" in
            inspect)
              ssh -T -F "$config" jiashu-aliyun 'bash -s' < deploy/aliyun/inspect.sh
              ssh -T -F "$config" jiashu-aliyun 'python3 - --inspect' < deploy/aliyun/nginx-test-site.py
              ;;
            verify)
              [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
              ssh -T -F "$config" jiashu-aliyun "python3 - --expected-commit '$EXPECTED_COMMIT'" < deploy/aliyun/verify-live.py
              ;;
            migration-prepare|migration-fetch-plan|migration-apply|migration-verify|migration-cleanup)
              [[ "$EXPECTED_APP_COMMIT" =~ ^[a-f0-9]{40}$ ]]
              phase=${OPERATION#migration-}
              if [[ "$phase" == apply ]]; then [[ "$EXPECTED_PLAN_HASH" =~ ^[a-f0-9]{64}$ ]]; fi
              if [[ "$phase" == fetch-plan ]]; then [[ -n "$MIGRATION_REQUEST" && ${#MIGRATION_REQUEST} -le 16000 ]]; fi
              remote_dir=$(ssh -T -F "$config" jiashu-aliyun 'umask 077; mktemp -d /tmp/jiashu-owner-migration.XXXXXXXX')
              [[ "$remote_dir" =~ ^/tmp/jiashu-owner-migration\.[A-Za-z0-9]+$ ]]
              cleanup_migration() { ssh -T -F "$config" jiashu-aliyun "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true; }
              trap cleanup_migration EXIT
              scp -F "$config" deploy/aliyun/common.sh deploy/aliyun/run-owner-migration.sh deploy/aliyun/owner-migration-worker.mjs "jiashu-aliyun:$remote_dir/"
              if [[ -f selfhost/owner-migration-import.ts ]]; then scp -F "$config" selfhost/owner-migration-import.ts "jiashu-aliyun:$remote_dir/"; fi
              if [[ "$phase" == fetch-plan ]]; then
                printf '%s\n' "$MIGRATION_REQUEST" | ssh -T -F "$config" jiashu-aliyun "bash '$remote_dir/run-owner-migration.sh' '$phase' '$EXPECTED_APP_COMMIT' '$EXPECTED_PLAN_HASH'"
              else
                ssh -T -F "$config" jiashu-aliyun "bash '$remote_dir/run-owner-migration.sh' '$phase' '$EXPECTED_APP_COMMIT' '$EXPECTED_PLAN_HASH'" < /dev/null
              fi
              ;;
            install-docker)
              ssh -T -F "$config" jiashu-aliyun 'bash -s -- --install' < deploy/aliyun/install-docker.sh
              ;;
            transport-test)
              bash deploy/aliyun/measure-transfer.sh
              node deploy/aliyun/https-transfer.mjs --probe
              ;;
            inspect-retired|retire-old)
              remote_dir=$(ssh -T -F "$config" jiashu-aliyun 'umask 077; mktemp -d /tmp/jiashu-retire.XXXXXXXX')
              [[ "$remote_dir" =~ ^/tmp/jiashu-retire\.[A-Za-z0-9]+$ ]]
              cleanup_retire() { ssh -T -F "$config" jiashu-aliyun "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true; }
              trap cleanup_retire EXIT
              scp -F "$config" deploy/aliyun/retire-old-services.py deploy/aliyun/nginx-test-site.py "jiashu-aliyun:$remote_dir/"
              if [[ "$OPERATION" == inspect-retired ]]; then
                ssh -T -F "$config" jiashu-aliyun "python3 '$remote_dir/retire-old-services.py' --inspect"
              else
                [[ "$EXPECTED_CONFIG_HASH" =~ ^[a-f0-9]{64}$ ]]
                [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
                ssh -T -F "$config" jiashu-aliyun "python3 '$remote_dir/retire-old-services.py' --apply --expected-hash '$EXPECTED_CONFIG_HASH' --expected-commit '$EXPECTED_COMMIT' --port 3100"
                ssh -T -F "$config" jiashu-aliyun "python3 - --expected-commit '$EXPECTED_COMMIT'" < deploy/aliyun/verify-live.py
              fi
              ;;
            configure-web)
              [[ "$EXPECTED_CONFIG_HASH" =~ ^[a-f0-9]{64}$ ]]
              [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
              ssh -T -F "$config" jiashu-aliyun "python3 - --apply --expected-hash '$EXPECTED_CONFIG_HASH' --expected-commit '$EXPECTED_COMMIT' --port 3100" < deploy/aliyun/nginx-test-site.py
              ssh -T -F "$config" jiashu-aliyun "python3 - --expected-commit '$EXPECTED_COMMIT'" < deploy/aliyun/verify-live.py
              ;;
            *) exit 1 ;;
          esac
      - if: always()
        run: rm -f "$RUNNER_TEMP/jiashu-deploy-key" "$RUNNER_TEMP/jiashu-known-hosts" "$RUNNER_TEMP/jiashu-ssh-config"
