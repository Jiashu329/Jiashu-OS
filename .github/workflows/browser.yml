name: Browser acceptance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-browser-acceptance:
    # Playwright 1.58.2 supports Ubuntu 24.04; ubuntu-latest may advance first.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: |
            outputs/browser-report
            outputs/browser-results
          retention-days: 7
          if-no-files-found: ignore
