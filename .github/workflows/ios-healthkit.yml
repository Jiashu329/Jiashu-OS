name: iOS HealthKit checks

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'lib/health.ts'
      - 'lib/backup-volumes.ts'
      - 'lib/data-backup.ts'
      - '.github/workflows/ios-healthkit.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/health.ts'
      - 'lib/backup-volumes.ts'
      - 'lib/data-backup.ts'
      - '.github/workflows/ios-healthkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Xcode project structure
        run: python3 ios/JiashuHealthProbe/scripts/verify-project.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate actual Swift exports with the backend parser
        run: |
          xcrun swiftc -parse-as-library \
            ios/JiashuHealthProbe/Sources/StepModels.swift \
            ios/JiashuHealthProbe/Sources/HealthSyncModels.swift \
            ios/JiashuHealthProbe/scripts/ExportContractFixtures.swift \
            -o "$RUNNER_TEMP/health-export-contract"
          "$RUNNER_TEMP/health-export-contract" > "$RUNNER_TEMP/health-export-contract.ndjson"
          node --experimental-strip-types ios/JiashuHealthProbe/scripts/validate-export-contract.mjs \
            "$RUNNER_TEMP/health-export-contract.ndjson"

      - name: Validate lossless Swift backup files with the backend parser
        run: |
          node --experimental-strip-types ios/JiashuHealthProbe/scripts/create-backup-contract.mjs \
            "$RUNNER_TEMP/native-backup-contract"
          xcrun swiftc -parse-as-library \
            ios/JiashuHealthProbe/Sources/NativeBackupCodec.swift \
            ios/JiashuHealthProbe/scripts/BackupContractFixtures.swift \
            -o "$RUNNER_TEMP/native-backup-contract-tool"
          "$RUNNER_TEMP/native-backup-contract-tool" \
            "$RUNNER_TEMP/native-backup-contract/server-backup-set.json" \
            "$RUNNER_TEMP/native-backup-contract/swift-output"
          node --experimental-strip-types ios/JiashuHealthProbe/scripts/validate-backup-contract.mjs \
            "$RUNNER_TEMP/native-backup-contract/server-backup-set.json" \
            "$RUNNER_TEMP/native-backup-contract/swift-output"

      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          data = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json']
          ))
          candidates = []
          for runtime, devices in data['devices'].items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'\d+', runtime.split('.iOS-')[1])))
              for device in devices:
                  if version >= (17,) and device.get('isAvailable') and device['name'].startswith('iPhone'):
                      candidates.append((version, device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator with iOS 17 or later')
          simulator = max(candidates)[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'id={simulator}\n')
          PY

      - name: Build the app and run XCTest
        env:
          TEST_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
          # Simulator-only ad-hoc identity gives the app a real Keychain access
          # group. No Apple account, certificate or device signing is involved.
          export NATIVE_SIM_ENTITLEMENTS="$RUNNER_TEMP/native-simulator.entitlements"
          python3 - <<'PY'
          import os
          import plistlib
          with open('ios/JiashuHealthProbe/Config/JiashuHealthProbe.entitlements', 'rb') as source:
              entitlements = plistlib.load(source)
          entitlements.update({
              'application-identifier': 'JIASHUCI00.com.jiashu.healthprobe',
              'keychain-access-groups': ['JIASHUCI00.com.jiashu.healthprobe'],
              'com.apple.developer.team-identifier': 'JIASHUCI00',
              'get-task-allow': True,
          })
          with open(os.environ['NATIVE_SIM_ENTITLEMENTS'], 'wb') as output:
              plistlib.dump(entitlements, output)
          PY
          xcodebuild test \
            -project ios/JiashuHealthProbe/JiashuHealthProbe.xcodeproj \
            -scheme JiashuHealthProbe \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/healthprobe-derived" \
            -resultBundlePath "$RUNNER_TEMP/healthprobe-tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_ENTITLEMENTS="$NATIVE_SIM_ENTITLEMENTS"

      - name: Save test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthprobe-xctest-results
          path: ${{ runner.temp }}/healthprobe-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Extract synthetic signed-in native previews
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/healthprobe-tests.xcresult" ]]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/healthprobe-tests.xcresult" \
              --output-path "$RUNNER_TEMP/native-ux-previews"
          fi

      - name: Save synthetic signed-in native previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-native-ux-previews
          path: ${{ runner.temp }}/native-ux-previews
          retention-days: 7
          if-no-files-found: ignore

      - name: Capture the signed-out native screen
        env:
          TEST_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl install "$TEST_SIMULATOR_ID" "$RUNNER_TEMP/healthprobe-derived/Build/Products/Debug-iphonesimulator/JiashuHealthProbe.app"
          xcrun simctl terminate "$TEST_SIMULATOR_ID" com.jiashu.healthprobe || true
          xcrun simctl launch "$TEST_SIMULATOR_ID" com.jiashu.healthprobe
          sleep 3
          xcrun simctl io "$TEST_SIMULATOR_ID" screenshot "$RUNNER_TEMP/native-login.png"

      - name: Save anonymous app preview
        uses: actions/upload-artifact@v4
        with:
          name: native-login-preview
          path: ${{ runner.temp }}/native-login.png
          retention-days: 7
