name: iOS HealthKit checks

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-healthkit.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-healthkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Xcode project structure
        run: python3 ios/JiashuHealthProbe/scripts/verify-project.py

      - name: Select an installed iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          data = json.loads(subprocess.check_output(
              ['xcrun', 'simctl', 'list', 'devices', 'available', '--json']
          ))
          candidates = []
          for runtime, devices in data['devices'].items():
              if '.iOS-' not in runtime:
                  continue
              version = tuple(map(int, re.findall(r'\d+', runtime.split('.iOS-')[1])))
              for device in devices:
                  if version >= (17,) and device.get('isAvailable') and device['name'].startswith('iPhone'):
                      candidates.append((version, device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator with iOS 17 or later')
          simulator = max(candidates)[1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'id={simulator}\n')
          PY

      - name: Build the app and run XCTest
        env:
          TEST_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
          xcodebuild build-for-testing \
            -project ios/JiashuHealthProbe/JiashuHealthProbe.xcodeproj \
            -scheme JiashuHealthProbe \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/healthprobe-derived" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
          # Simulator-only ad-hoc identity gives the app a real Keychain access
          # group. No Apple account, certificate or device signing is involved.
          export NATIVE_SIM_ENTITLEMENTS="$RUNNER_TEMP/native-simulator.entitlements"
          python3 - <<'PY'
          import os
          import plistlib
          with open('ios/JiashuHealthProbe/Config/JiashuHealthProbe.entitlements', 'rb') as source:
              entitlements = plistlib.load(source)
          entitlements.update({
              'application-identifier': 'JIASHUCI00.com.jiashu.healthprobe',
              'keychain-access-groups': ['JIASHUCI00.com.jiashu.healthprobe'],
              'com.apple.developer.team-identifier': 'JIASHUCI00',
              'get-task-allow': True,
          })
          with open(os.environ['NATIVE_SIM_ENTITLEMENTS'], 'wb') as output:
              plistlib.dump(entitlements, output)
          PY
          NATIVE_SIM_APP="$RUNNER_TEMP/healthprobe-derived/Build/Products/Debug-iphonesimulator/JiashuHealthProbe.app"
          codesign --force --sign - "$NATIVE_SIM_APP/PlugIns/JiashuHealthProbeTests.xctest"
          codesign --force --sign - --entitlements "$NATIVE_SIM_ENTITLEMENTS" "$NATIVE_SIM_APP"
          xcodebuild test-without-building \
            -project ios/JiashuHealthProbe/JiashuHealthProbe.xcodeproj \
            -scheme JiashuHealthProbe \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/healthprobe-derived" \
            -resultBundlePath "$RUNNER_TEMP/healthprobe-tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Save test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healthprobe-xctest-results
          path: ${{ runner.temp }}/healthprobe-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Capture the signed-out native screen
        env:
          TEST_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl install "$TEST_SIMULATOR_ID" "$RUNNER_TEMP/healthprobe-derived/Build/Products/Debug-iphonesimulator/JiashuHealthProbe.app"
          xcrun simctl terminate "$TEST_SIMULATOR_ID" com.jiashu.healthprobe || true
          xcrun simctl launch "$TEST_SIMULATOR_ID" com.jiashu.healthprobe
          sleep 3
          xcrun simctl io "$TEST_SIMULATOR_ID" screenshot "$RUNNER_TEMP/native-login.png"

      - name: Save anonymous app preview
        uses: actions/upload-artifact@v4
        with:
          name: native-login-preview
          path: ${{ runner.temp }}/native-login.png
          retention-days: 7
