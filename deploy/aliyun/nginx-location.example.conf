# Manual integration only. Do not replace an existing server block or certificate.
# In the existing HTTPS server for www.treefund.asia, preserve server_name,
# ssl_certificate / ssl_certificate_key and an external backup of the old location.
# Merge this location only after loopback readiness and the new login were verified.
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header oai-authenticated-user-id "";
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_set_header oai-authenticated-user-full-name-encoding "";
    proxy_cache off;
    client_max_body_size 18m;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
}
